<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Wake on LAN</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page">
        <header class="header">
            <h1>Wake on LAN</h1>
            <p class="sub">webOS TV - 开机自动唤醒 Win11</p>
        </header>

        <section class="card">
            <div class="row">
                <div class="field grow">
                    <label for="mac">目标电脑 MAC 地址</label>
                    <input id="mac" type="text" placeholder="AA:BB:CC:DD:EE:FF" spellcheck="false">
                </div>
                <div class="field grow">
                    <label for="ip">目标 IP（可用 255.255.255.255 广播）</label>
                    <input id="ip" type="text" placeholder="255.255.255.255" spellcheck="false">
                </div>
                <div class="field small">
                    <label for="port">端口</label>
                    <input id="port" type="number" value="9" min="1" max="65535">
                </div>
            </div>
        </section>

        <section class="card">
            <div class="row switch-row">
                <div class="field grow">
                    <label for="enabled">启用功能</label>
                    <p class="hint">总开关。关闭后不发送任何魔术包。</p>
                </div>
                <label class="switch">
                    <input type="checkbox" id="enabled" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="row switch-row">
                <div class="field grow">
                    <label for="sendOnBoot">开机自动发送</label>
                    <p class="hint">电视开机后自动向 Win11 发送魔术包（后台，无弹窗）。</p>
                </div>
                <label class="switch">
                    <input type="checkbox" id="sendOnBoot" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="row switch-row">
                <div class="field grow">
                    <label for="bootDelay">开机后延迟（秒）</label>
                    <p class="hint">等待电视网络就绪后再发送。</p>
                </div>
                <input id="bootDelay" class="num-input" type="number" value="15" min="0" max="120">
            </div>
        </section>

        <section class="card actions">
            <button id="btnSave" class="btn primary">保存设置</button>
            <button id="btnWake" class="btn">立即唤醒（测试）</button>
            <span id="status" class="status"></span>
        </section>

        <p class="foot">修改设置后请点击「保存设置」。卸载应用即可完全移除本功能。</p>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
