<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Wake on LAN</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page">
        <header class="header">
            <h1>Wake on LAN</h1>
            <p class="sub">webOS TV - 开机自动唤醒电脑</p>
        </header>

        <section class="card">
            <div class="field">
                <label for="device">选择要唤醒的设备</label>
                <div class="row inline">
                    <div class="dd grow" id="deviceWrap">
                        <button type="button" id="device" class="dd-trigger"
                                aria-haspopup="listbox" aria-expanded="false"
                                aria-label="选择设备">—— 请选择设备 ——</button>
                        <div class="dd-list" id="deviceList" role="listbox" aria-label="设备列表" hidden></div>
                    </div>
                    <button id="btnScan" class="btn">扫描设备</button>
                </div>
                <p class="hint">用遥控器方向键选择设备、按 OK 确认；扫描会列出局域网内发现的电脑。打开列表后按遥控器返回键可退出列表。</p>
            </div>
        </section>

        <section class="card">
            <div class="row">
                <div class="field grow">
                    <label for="mac">MAC 地址（选设备后自动填入，可手动改）</label>
                    <input id="mac" type="text" placeholder="AA:BB:CC:DD:EE:FF" spellcheck="false" readonly>
                </div>
                <div class="field grow">
                    <label for="ip">目标 IP（可用 255.255.255.255 广播）</label>
                    <input id="ip" type="text" placeholder="255.255.255.255" spellcheck="false" readonly>
                </div>
                <div class="field small">
                    <label for="port">端口</label>
                    <input id="port" type="number" value="9" min="1" max="65535" readonly>
                </div>
            </div>
            <p class="hint">聚焦到输入框时不会自动弹出键盘；需要修改时先按 OK 才会出现软键盘。</p>
        </section>

        <section class="card">
            <div class="row switch-row">
                <div class="field grow">
                    <label>启用功能</label>
                    <p class="hint">总开关。关闭后不发送任何魔术包。</p>
                </div>
                <label id="swEnabled" class="switch" tabindex="0">
                    <input type="checkbox" id="enabled" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="row switch-row">
                <div class="field grow">
                    <label>开机自动发送</label>
                    <p class="hint">电视冷开机（彻底断电/完全关机再开机）后自动发送一次魔术包唤醒电脑。短待机/「即时开机」唤醒不自动发送。</p>
                </div>
                <label id="swSendOnBoot" class="switch" tabindex="0">
                    <input type="checkbox" id="sendOnBoot" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </section>

        <section class="card actions">
            <button id="btnSave" class="btn">保存</button>
            <button id="btnExit" class="btn">退出</button>
            <button id="btnWake" class="btn">立即唤醒（测试）</button>
            <span id="status" class="status"></span>
        </section>

        <p class="foot">按遥控器方向键在各项之间移动，按 OK 选中/确认。修改后请点击「保存」；点击「退出」或按遥控器返回键可退出应用。</p>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
